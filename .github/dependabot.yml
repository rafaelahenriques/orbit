# Weekly dependency updates, opened as pull requests.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint, used by Next.js's lint config, doesn't support
      # TypeScript 7 yet. Remove this rule once it does.
      - dependency-name: typescript
        versions: [">=7"]
      # Node's type definitions must match the Node version we run (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Stay on a long-term support (LTS) release of Node. Upgrade the major
      # version by hand, together with .nvmrc and @types/node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
